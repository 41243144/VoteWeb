services:
  - type: web
    name: voteweb
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn voteweb.wsgi"
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true 
      - key: DJANGO_DEBUG
        value: "False"
      - key: EMAIL_USER
        value: d41243144@gmail.com
      - key: EMAIL_PASS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: d41243144@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: VoteWeb
          property: connectionString

databases:
  - name: VoteWeb
    databaseName: voteweb
    user: voteuser
